<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>搭路计划 · Bridge Blitz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#f8f6ef;--muted:#a9a79c;--bg:#111310;--panel:#1a1d19;--line:#343930;--lime:#d7f36a;--orange:#ff9f43;--danger:#ff6e61}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% 10%,#252b21 0,#111310 45%);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.shell{width:min(1160px,100%);padding:30px 28px 28px;display:flex;flex-direction:column;gap:22px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border:1px solid var(--lime);display:grid;place-items:center;color:var(--lime);font-size:21px;transform:rotate(45deg)}.mark span{transform:rotate(-45deg)}.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.16em;color:var(--lime);text-transform:uppercase}.brand h1{font-size:20px;letter-spacing:-.03em;margin:3px 0 0}.topmeta{display:flex;align-items:center;gap:22px}.mode-switch{display:flex;padding:4px;background:#20251f;border:1px solid var(--line);border-radius:7px}.mode-switch button{font:500 11px 'DM Mono';color:var(--muted);border:0;background:transparent;padding:8px 11px;border-radius:4px;cursor:pointer;letter-spacing:.08em}.mode-switch button.active{background:var(--lime);color:#172014}.score{font:500 11px 'DM Mono';color:var(--muted);display:flex;gap:8px;align-items:center}.score b{font-size:18px;color:var(--ink);font-weight:500}.layout{display:grid;grid-template-columns:1fr 270px;gap:22px;align-items:start}.game-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #0005}.game-head{padding:17px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.level{font:500 10px 'DM Mono';letter-spacing:.14em;color:var(--muted)}.level strong{color:var(--ink);font-size:13px;letter-spacing:.02em}.goal{font:500 10px 'DM Mono';color:var(--orange);letter-spacing:.08em}.canvas-wrap{position:relative;background:#b1c1bb;aspect-ratio:16/9;min-height:390px;overflow:hidden}.canvas-wrap canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:50%;top:18px;transform:translateX(-50%);font:500 10px 'DM Mono';letter-spacing:.1em;color:#172019;background:#e8f0d9cc;padding:9px 13px;border-radius:3px;transition:opacity .25s}.hint.hide{opacity:0}.touch-zone{position:absolute;inset:0;cursor:pointer}.game-foot{padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.status{font:500 11px 'DM Mono';color:var(--muted);letter-spacing:.06em}.status span{color:var(--lime)}.progress{display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#465044}.dot.on{background:var(--lime);box-shadow:0 0 12px var(--lime)}.side{display:flex;flex-direction:column;gap:14px}.panel{border:1px solid var(--line);border-radius:8px;background:#171a16;padding:17px}.panel-title{font:500 10px 'DM Mono';letter-spacing:.12em;color:var(--muted);margin-bottom:13px}.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid #2b3029}.stat-row:first-of-type{border-top:0;padding-top:0}.stat-row span{font-size:12px;color:#c6c9bc}.stat-row b{font:500 16px 'DM Mono';color:var(--lime)}.legend{display:grid;gap:11px}.legend-item{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted)}.legend-key{width:20px;height:7px;border-radius:1px}.key-lime{background:var(--lime)}.key-orange{background:var(--orange)}.key-black{background:#1a1d19;border:1px solid #586255}.tip{font-size:12px;line-height:1.6;color:#bfc4b6}.tip em{font-style:normal;color:var(--lime)}.reset{width:100%;padding:10px;border:1px solid #4e574a;background:transparent;color:var(--ink);border-radius:5px;font:500 11px 'DM Mono';letter-spacing:.08em;cursor:pointer}.reset:hover{border-color:var(--lime);color:var(--lime)}.footer-note{font:10px 'DM Mono';color:#61695d;letter-spacing:.08em;text-align:right;margin-top:auto}
@media(max-width:820px){.shell{padding:18px 14px 20px;gap:14px}.topbar{align-items:flex-start}.topmeta{gap:10px;flex-direction:column-reverse;align-items:flex-end}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.panel:last-child{grid-column:span 2}.canvas-wrap{min-height:250px}.game-foot{padding:12px 14px}}
@media(max-width:520px){.brand h1{font-size:17px}.side{grid-template-columns:1fr}.panel:last-child{grid-column:auto}.canvas-wrap{aspect-ratio:4/3}.hint{font-size:9px;white-space:nowrap}.score{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark"><span>+</span></div><div><div class="eyebrow">micro game / 001</div><h1>搭路计划 <span style="color:var(--muted);font-weight:400">· Bridge Blitz</span></h1></div></div><div class="topmeta"><div class="score">TOTAL <b id="totalScore">0000</b></div><div class="mode-switch"><button class="active" data-mode="2d">2D 平面</button><button data-mode="3d">3D 纵深</button></div></div></header>
<main class="layout"><section class="game-card"><div class="game-head"><div class="level">关卡 <strong id="levelText">01 / 05</strong></div><div class="goal" id="goalText">抵达橙色平台</div></div><div class="canvas-wrap"><canvas id="gameCanvas"></canvas><div class="hint" id="hint">长按屏幕 · 延长木板 · 松手搭路</div><div class="touch-zone" id="touchZone"></div></div><div class="game-foot"><div class="status" id="status"><span>●</span> 准备出发</div><div class="progress" id="progress"></div></div></section>
<aside class="side"><div class="panel"><div class="panel-title">LIVE METRICS</div><div class="stat-row"><span>当前连击</span><b id="streak">×0</b></div><div class="stat-row"><span>木板长度</span><b id="length">0.0</b></div><div class="stat-row"><span>落点误差</span><b id="accuracy">—</b></div></div><div class="panel"><div class="panel-title">FIELD GUIDE</div><div class="legend"><div class="legend-item"><span class="legend-key key-lime"></span>安全落点区</div><div class="legend-item"><span class="legend-key key-orange"></span>下一座平台</div><div class="legend-item"><span class="legend-key key-black"></span>深坑 / 失败</div></div></div><div class="panel"><div class="panel-title">HOW TO PLAY</div><div class="tip">按住任意位置让木板变长。<br>松手后木板会倒下，<em>刚好够长</em>才能到达下一座平台。</div><button class="reset" id="resetBtn">↻ 重新开始本关</button></div></aside></main>
<div class="footer-note">built for brave bridge builders · v1.0</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),zone=document.getElementById('touchZone');
const ui={level:document.getElementById('levelText'),status:document.getElementById('status'),length:document.getElementById('length'),accuracy:document.getElementById('accuracy'),streak:document.getElementById('streak'),total:document.getElementById('totalScore'),hint:document.getElementById('hint'),progress:document.getElementById('progress'),goal:document.getElementById('goalText')};
let mode='2d', level=1, total=0, streak=0, phase='ready', hold=false, startTime=0, plank=0, travel=0, raf=0, world={};
const W=1000,H=560;
function makeWorld(){let widths=[74,128,88,158,102,122,92,145];let gaps=[110,152,94,178,116,150,105,160]; let x=100; let plats=[]; for(let i=0;i<6;i++){plats.push({x,w: i===0?132:widths[(i+level-1)%widths.length],y:0}); x+=plats[i].w+gaps[(i+level-1)%gaps.length]} world={plats,cam:0};}
function fit(){const d=devicePixelRatio||1;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw();} window.addEventListener('resize',fit);
function setupProgress(){ui.progress.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('span');s.className='dot '+(i<level-1?'on':'');ui.progress.appendChild(s)}}
function reset(){cancelAnimationFrame(raf);makeWorld();phase='ready';hold=false;plank=0;travel=0;ui.level.textContent=String(level).padStart(2,'0')+' / 05';ui.status.innerHTML='<span>●</span> 准备出发';ui.length.textContent='0.0';ui.accuracy.textContent='—';ui.goal.textContent='抵达橙色平台';setupProgress();draw();}
function begin(){if(phase!=='ready')return; phase='charging';hold=true;startTime=performance.now();ui.hint.classList.add('hide');ui.status.innerHTML='<span style="color:var(--orange)">●</span> 木板延长中…';loop()}
function release(){if(!hold)return;hold=false;if(phase==='charging'){phase='falling';travel=plank;ui.status.innerHTML='<span style="color:var(--orange)">●</span> 木板落下…';loop()}}
function finish(){const p=world.plats[1], start=world.plats[0].x+world.plats[0].w, targetStart=p.x, targetEnd=p.x+p.w; let land=start+plank; let err= land<targetStart?targetStart-land:land>targetEnd?land-targetEnd:Math.min(land-targetStart,targetEnd-land); let ok=land>=targetStart&&land<=targetEnd; ui.accuracy.textContent=ok?Math.abs(err).toFixed(1):'MISS'; if(ok){streak++; total+=Math.max(10,Math.round(100-Math.abs(err)));ui.total.textContent=String(total).padStart(4,'0');ui.streak.textContent='×'+streak;ui.status.innerHTML='<span>●</span> 稳稳落地！';phase='success';setTimeout(()=>{if(level<5){level++;reset()}else{ui.status.innerHTML='<span>●</span> 全部通过！';}},700)}else{streak=0;ui.streak.textContent='×0';ui.status.innerHTML='<span style="color:var(--danger)">●</span> 木板不够长，掉进深坑';phase='fail';setTimeout(()=>{level=1;reset()},1100)} draw()}
function loop(){cancelAnimationFrame(raf); const now=performance.now(); if(phase==='charging'){plank=Math.min(360,(now-startTime)*0.24);ui.length.textContent=(plank/10).toFixed(1)} if(phase==='falling'){const t=Math.min(1,(now-startTime)/650); plank=travel; if(t>=1){finish();return}} draw(); if(phase==='charging'||phase==='falling')raf=requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='3d'?'#9db5b4':'#b9c9c1');g.addColorStop(1,'#72877d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H); if(mode==='3d')draw3d(); else draw2d();}
function draw2d(){const baseY=402;ctx.fillStyle='#7c9285';ctx.fillRect(0,baseY,W,H-baseY);ctx.fillStyle='#687d72';ctx.fillRect(0,baseY,W,8);let p0=world.plats[0],p1=world.plats[1];let sx=145, scale=1.05;ctx.save();ctx.translate(-world.cam,0);platform(p0.x,sx,p0.w,baseY);platform(p1.x,sx,p1.w,baseY,'next');ctx.fillStyle='#101410';ctx.fillRect(p0.x+p0.w,baseY-2,p1.x-(p0.x+p0.w),H-baseY);if(plank>0){ctx.save();ctx.translate(p0.x+p0.w,baseY-13);ctx.rotate(phase==='falling'?0:0);ctx.fillStyle='#c99455';ctx.fillRect(0,-7,plank,14);ctx.fillStyle='#f1cb8a';ctx.fillRect(0,-7,plank,3);ctx.restore()}person(p0.x+70,baseY-16);ctx.restore();decor2d();}
function platform(x,s,w,y,kind='base'){ctx.fillStyle=kind==='next'?'#f59b42':'#d7f36a';ctx.fillRect(x,y-10,w,10);ctx.fillStyle=kind==='next'?'#c77330':'#98b147';ctx.fillRect(x,y,w,16);ctx.fillStyle='#ffffff22';ctx.fillRect(x+12,y-6,w-24,2)}
function person(x,y){ctx.fillStyle='#1c241d';ctx.beginPath();ctx.arc(x,y-30,11,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1c241d';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x,y+10);ctx.moveTo(x,y-8);ctx.lineTo(x-16,y+4);ctx.moveTo(x,y-8);ctx.lineTo(x+16,y-3);ctx.moveTo(x,y+10);ctx.lineTo(x-11,y+30);ctx.moveTo(x,y+10);ctx.lineTo(x+11,y+30);ctx.stroke()}
function decor2d(){ctx.fillStyle='#ffffff18';for(let i=0;i<12;i++){let x=(i*121+40)%W;ctx.fillRect(x,110+(i%3)*35,2,2)}}
function draw3d(){const horizon=210,base=430;ctx.fillStyle='#7c9187';ctx.fillRect(0,horizon,W,H-horizon);ctx.fillStyle='#92a89d';ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W*.35,horizon);ctx.lineTo(W,base);ctx.lineTo(0,base);ctx.closePath();ctx.fill();ctx.strokeStyle='#d4e2d3aa';ctx.lineWidth=1;for(let i=0;i<11;i++){ctx.beginPath();ctx.moveTo(W*.5,horizon);ctx.lineTo(i*100,base);ctx.stroke()}for(let y=260;y<base;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}let p0=world.plats[0],p1=world.plats[1];const sx=0.72, x0=150,x1=520;ctx.fillStyle='#d7f36a';ctx.fillRect(x0,base-28,210,28);ctx.fillStyle='#f59b42';ctx.fillRect(x1,base-28,180,28);ctx.fillStyle='#152019';ctx.fillRect(x0+210,base-28,x1-x0-210,28);if(plank>0){ctx.fillStyle='#c99455';ctx.fillRect(x0+190,base-42,plank*.75,14)}person(x0+92,base-27)}
zone.addEventListener('pointerdown',e=>{e.preventDefault();begin()});window.addEventListener('pointerup',release);zone.addEventListener('pointerleave',e=>{if(hold)release()});document.querySelectorAll('.mode-switch button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode-switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;draw()}));document.getElementById('resetBtn').onclick=reset;fit();reset();
</script></body></html>
